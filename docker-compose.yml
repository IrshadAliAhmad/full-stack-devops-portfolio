services:
  postgres:
    image: postgres:16-alpine
    container_name: portfolio-postgres

    env_file:
      - ./backend/.env

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    restart: unless-stopped

    networks:
      - portfolio-network

  backend:
    build:
      context: ./backend

    container_name: portfolio-backend

    env_file:
      - ./backend/.env

    depends_on:
      postgres:
        condition: service_healthy

    ports:
      - "5000:5000"

    restart: unless-stopped

    networks:
      - portfolio-network

  frontend:
    build:
      context: ./frontend

    container_name: portfolio-frontend

    depends_on:
      backend:
        condition: service_started

    ports:
      - "80:80"

    restart: unless-stopped

    networks:
      - portfolio-network

volumes:
  postgres_data:

networks:
  portfolio-network:
    driver: bridge